# --- NEW SECTION: PASTE THIS AT THE TOP ---
# This controls how strict MoveIt is about the robot drifting before it starts moving
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.05  # <--- This fixes the "Invalid Trajectory: start point deviates" error


# --- YOUR EXISTING CONFIGURATION (Keep this below) ---
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint